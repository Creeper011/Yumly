name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          cache: pip

      - name: Install build dependencies
        run: pip install --upgrade pip build setuptools wheel

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist

      - name: Extract sdist source
        shell: bash
        run: |
          mkdir sdist-source
          tar -xzf sdist/*.tar.gz -C sdist-source --strip-components=1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_WHEEL_VERSION }}
          cache: pip

      - name: Setup Nim
        if: matrix.os != 'ubuntu-latest'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: ./sdist-source
        env:
          # wheels are built targeting cp310; nimpy links against the Python C API,
          # so runtime compatibility with 3.11+ depends on ABI stability.
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"

          CIBW_BEFORE_BUILD: nimble --nimbleDir:build/nimble install -y nimpy dotenv yaml

          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64

          CIBW_BEFORE_ALL_LINUX: >
            curl -sSfL
            https://nim-lang.org/download/nim-${{ vars.NIM_VERSION }}-linux_x64.tar.xz
            -o /tmp/nim.tar.xz &&
            tar xf /tmp/nim.tar.xz -C /opt

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/opt/nim-${{ vars.NIM_VERSION }}/bin:$PATH"

          CIBW_ENVIRONMENT_WINDOWS: >
            YUMLY_NIM_FLAGS="--cc:vcc"

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            python -c "import os, shutil;
            src='{wheel}';
            dst='{dest_dir}';
            name=os.path.basename(src).replace('linux_x86_64','manylinux_2_28_x86_64');
            shutil.copy(src, os.path.join(dst, name))"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_sdist, build_wheels]
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
