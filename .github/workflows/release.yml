name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim (macOS and Windows)
        if: matrix.os != 'ubuntu-latest'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nim dependencies (macOS and Windows)
        if: matrix.os != 'ubuntu-latest'
        run: nimble install -y nimpy dotenv

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"

          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "python -c \"import os, shutil; src = '{wheel}'; dst = '{dest_dir}'; name = os.path.basename(src).replace('linux_x86_64', 'manylinux_2_28_x86_64'); shutil.copy(src, os.path.join(dst, name))\""

          CIBW_BEFORE_ALL_LINUX: >
            NIM_VERSION=2.2.0 &&
            curl -sSfL https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz -o /tmp/nim.tar.xz &&
            tar xf /tmp/nim.tar.xz -C /opt &&
            /opt/nim-${NIM_VERSION}/bin/nimble install -y nimpy dotenv
          CIBW_ENVIRONMENT_LINUX: 'PATH="/opt/nim-2.2.0/bin:$PATH"'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}