name: CLI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: nimble --nimbleDir:build/nimble install -y nimpy dotenv yaml

      - name: Build CLI
        run: nimble --nimbleDir:build/nimble buildCli
        shell: bash
        env:
          YUMLY_NIM_FLAGS: ${{ matrix.os == 'windows-latest' && '--cc:vcc' || '' }}

      - name: Rename binaries
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            mv build/bin/yumly-cli build/bin/yumly-cli-linux-x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            mv build/bin/yumly-cli build/bin/yumly-cli-macos-x64
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv build/bin/yumly-cli.exe build/bin/yumly-cli-windows-x64.exe
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: build/bin/yumly-*

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_cli]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/yumly-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
