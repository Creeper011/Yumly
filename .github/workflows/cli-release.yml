name: CLI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: bash
        run: |
          nimble install -y nimpy dotenv

          curl -fsSL https://github.com/flyx/NimYAML/archive/refs/tags/v2.2.1.tar.gz -o nimyaml.tar.gz
          tar -xzf nimyaml.tar.gz
          pushd NimYAML-2.2.1
          nimble install -y
          popd

      - name: Build CLI
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            nim c -d:release -d:yumlyJson -d:yumlyYaml --opt:size --cc:vcc -o:yumly.exe utils/yumly_cli.nim
          else
            nim c -d:release -d:yumlyJson -d:yumlyYaml --opt:size -o:yumly utils/yumly_cli.nim
          fi
        shell: bash

      - name: Rename binaries
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            mv yumly yumly-cli-linux-x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            mv yumly yumly-cli-macos-x64
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv yumly.exe yumly-cli-windows-x64.exe
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: yumly-*

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_cli]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/yumly-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
