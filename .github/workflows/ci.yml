name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run benchmarks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-yumly
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Run suggestion tests
        run: |
          nim c -r --out:/tmp/test-suggestions-closest tests/test_suggestions_closest_match.nim
          nim c -r --out:/tmp/test-suggestions-syntax tests/test_suggestions_expected_syntax.nim
          nim c -r --out:/tmp/test-suggestions-errors tests/test_suggestions_structured_diagnostics.nim
          nim c -r --out:/tmp/test-suggestions-ranges tests/test_suggestions_tokenizer_ranges.nim

      - name: Run tests
        run: make tests

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: tests
    if: github.event.inputs.benchmarks == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-yumly
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Run benchmarks
        run: make tests-bench

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yumly-benchmarks
          path: |
            benchmark.ylwa
            benchmark_python.ylwa
          if-no-files-found: ignore
