name: Setup Yumly Environment
description: Installs Python, Nim, dependencies and the Yumly package

inputs:
  python-version:
    description: Python version to use
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Setup Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: stable

    - name: Cache Nimble packages
      uses: actions/cache@v4
      with:
        path: build/nimble
        key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
        restore-keys: |
          ${{ runner.os }}-nimble-

    - name: Install Nim dependencies
      run: nimble --nimbleDir:build/nimble install -y nimpy dotenv yaml
      shell: bash

    - name: Install Python dependencies
      run: pip install --upgrade pip build setuptools wheel pytest
      shell: bash

    - name: Install package
      run: pip install .
      shell: bash
